# Host nginx site for seq25. Install with:
#
#   sudo cp deploy/nginx/seq25.conf /etc/nginx/sites-available/seq25.conf
#   sudo ln -s ../sites-available/seq25.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seq25.example.com
#
# certbot adds the 443 listener and the http -> https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name seq25.example.com;  # your domain

    root /var/www/seq25;

    location /songs {
        proxy_pass http://127.0.0.1:3025;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build output; safe to cache forever.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}
